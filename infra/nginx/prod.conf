server {
    listen 5173;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

		error_page 413 /error_413.html;

    location = /error_413.html {
        root /usr/share/nginx/custom_html;
        internal;
    }
}