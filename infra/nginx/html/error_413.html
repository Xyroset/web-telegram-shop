<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>File Too Large</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 flex items-center justify-center h-screen">
    <div
      class="bg-white p-8 rounded-lg shadow-md max-w-md w-full text-center border border-red-200"
    >
      <svg
        class="mx-auto h-12 w-12 text-red-500 mb-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
        />
      </svg>
      <h2 class="text-2xl font-bold text-gray-900 mb-2">Payload Too Large</h2>
      <p class="text-gray-600 mb-6">
        The file you are trying to upload exceeds the 500MB server limit. Please
        optimize the file and try again.
      </p>
      <button
        onclick="window.history.back()"
        class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded transition-colors"
      >
        Go Back
      </button>
    </div>
  </body>
</html>
