services:
  db:
    image: postgres:16-alpine
    container_name: db_WEB_TELEGRAM_SHOP_STANDALONE
    restart: always
    volumes:
      - db_data_standalone:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db

  minio:
    image: quay.io/minio/minio
    container_name: minio_WEB_TELEGRAM_SHOP_STANDALONE
    restart: always
    volumes:
      - minio_data_standalone:/data
    env_file:
      - .env
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY}
      - MINIO_SERVER_URL=http://minio:9000
      - MINIO_REGION_NAME=us-east-1
      - VIRTUAL_HOST=s3.${BACKEND_VIRTUAL_HOST}
      - LETSENCRYPT_HOST=s3.${BACKEND_VIRTUAL_HOST}
      - VIRTUAL_PORT=9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: quay.io/minio/mc
    container_name: minio_setup_WEB_TELEGRAM_SHOP_STANDALONE
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY};
      mc mb myminio/${AWS_STORAGE_BUCKET_NAME} --ignore-existing;
      mc anonymous set public myminio/${AWS_STORAGE_BUCKET_NAME};
      exit 0;
      "

  worker:
    build: ./backend
    container_name: worker_WEB_TELEGRAM_SHOP_STANDALONE
    command: celery -A config.celery.app worker --loglevel=warning
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - AWS_S3_REGION_NAME=us-east-1

  celery_beat:
    build: ./backend
    container_name: celery_beat_WEB_TELEGRAM_SHOP_STANDALONE
    command: celery -A config.celery.app beat --loglevel=warning
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - AWS_S3_REGION_NAME=us-east-1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - DEBUG=false
        - VITE_API_URL=https://${BACKEND_VIRTUAL_HOST}
    container_name: frontend_WEB_TELEGRAM_SHOP_STANDALONE
    restart: always
    env_file:
      - .env
    environment:
      - VIRTUAL_HOST=${FRONTEND_VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${FRONTEND_LETSENCRYPT_HOST}
      - VIRTUAL_PORT=5173
    depends_on:
      - backend
    volumes:
      - ./infra/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf:ro
      - ./infra/nginx/html:/usr/share/nginx/custom_html:ro

  backend:
    build: ./backend
    container_name: backend_WEB_TELEGRAM_SHOP_STANDALONE
    command: sh -c "python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py setup_telegram_webhook &&
      python manage.py reload_shop_config &&
      daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((''127.0.0.1'', 8000))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    env_file:
      - .env
    environment:
      - VIRTUAL_HOST=${BACKEND_VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${BACKEND_LETSENCRYPT_HOST}
      - VIRTUAL_PORT=8000
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_S3_CUSTOM_DOMAIN=s3.${BACKEND_VIRTUAL_HOST}/${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_SECURE_URLS=True
      - AWS_S3_REGION_NAME=us-east-1

  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    restart: always
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: acme-companion
    restart: always
    environment:
      - NGINX_PROXY_CONTAINER=nginx-proxy
      - DEFAULT_EMAIL=${DEFAULT_EMAIL}
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx-proxy

volumes:
  db_data_standalone:
  minio_data_standalone:
  certs:
  vhost:
  html:
  acme:
