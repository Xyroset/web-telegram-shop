[tool.poetry]
name = "backend"
version = "1.0.0"
description = "Web Telegram Shop"
authors = ["Xyroset"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
django = "^5.1.0"
djangorestframework = "^3.17.0"
aiogram = ">=3.17.0"
celery = ">=5.3,<5.4"
django-celery-results = ">=2.5,<2.6"
redis = ">=5.0,<6.0"
psycopg2-binary = "^2.9.11"
eventlet = ">=0.33,<0.34"
watchfiles = ">=0.20,<0.21"
flower = ">=2.0,<2.1"
web3 = ">=7.8.0"
python-dotenv = "^1.2.2"
djangorestframework-simplejwt = "^5.5.1"
django-cors-headers = "^4.9.0"
drf-spectacular = "^0.29.0"
pillow = "^12.1.1"
sentry-sdk = "^2.55.0"
django-redis = "^6.0.0"
django-unfold = "^0.86.1"
django-filter = "^25.2"
whitenoise = "^6.12.0"
daphne = "^4.2.1"
django-storages = "^1.14.6"
boto3 = "^1.43.0"
deep-translator = "^1.11.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-django = "^4.8.0"
pytest-mock = "^3.14.0"
responses = "^0.25.0"
factory-boy = "^3.3.0"
ruff = "^0.6.0"
mypy = "^1.19.0"  
django-stubs = {extras = ["compatible-mypy"], version = "^5.0.4"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "migrations",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = []

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = [
    "^venv/",
    "^env/",
    "^\\.venv/",
    ".*/migrations/",
]
warn_return_any = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "."

[tool.django-stubs]
django_settings_module = "config.settings"

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "unfold.*",
]
ignore_missing_imports = true