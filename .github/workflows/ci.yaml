name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: "test_user"
          POSTGRES_PASSWORD: "test_pass"
          POSTGRES_DB: "test_db"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:latest
        ports:
          - 6379:6379

    env:
      DJANGO_SECRET_KEY: "fake-secret-key-for-testing-1234"
      DEBUG: "True"
      POSTGRES_USER: "test_user"
      POSTGRES_PASSWORD: "test_pass"
      POSTGRES_DB: "test_db"
      POSTGRES_HOST: "localhost"
      POSTGRES_PORT: "5432"
      REDIS: "localhost"
      TZ: "UTC"
      TELEGRAM_BOT_TOKEN: "test_token"
      NGROK_AUTHTOKEN_ADMIN: "test_authtoken"
      NOWPAYMENTS_API_URL: "test_api_url"
      NOWPAYMENTS_API_KEY: "test_api_key"
      NOWPAYMENTS_IPN_SECRET: "test_ipn_secret"
      SENTRY_DSN: ""
      AWS_ACCESS_KEY_ID: "fake_access_key"
      AWS_SECRET_ACCESS_KEY: "fake_secret_key"
      AWS_STORAGE_BUCKET_NAME: "fake_bucket"
      AWS_S3_ENDPOINT_URL: "https://fake.example.com"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==1.8.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"
          cache-dependency-path: backend/poetry.lock

      - name: Install dependencies
        run: poetry config virtualenvs.create false && poetry install --no-interaction --no-ansi

      - name: Mount and mock shop_config to /app
        run: |
          sudo mkdir -p /app/shop_config

          sudo cp -r ../config/* /app/shop_config/

          poetry run python scripts/init_project.py

          sudo chmod -R 777 /app

          mkdir -p staticfiles

      - name: Run Backend Linter (Ruff)
        run: poetry run ruff check .

      - name: Run Backend Type Checker (Mypy)
        run: poetry run mypy . --show-traceback

      - name: Run Backend Tests (Pytest)
        run: poetry run pytest -v -s

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Formatter
        run: npm run format

      - name: Run Frontend Linter
        run: npm run lint
