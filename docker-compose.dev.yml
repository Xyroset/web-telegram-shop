services:
  db:
    image: postgres:16-alpine
    container_name: db_WEB_TELEGRAM_SHOP
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=web_telegram_shop.dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=2879
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=localhost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web_telegram_shop.dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=web_telegram_shop.dev
      - DB_USER=postgres
      - DB_PASSWORD=2879
      - DB_HOST=db

  minio:
    image: quay.io/minio/minio
    container_name: minio_WEB_TELEGRAM_SHOP
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: quay.io/minio/mc
    container_name: minio_setup_WEB_TELEGRAM_SHOP
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/web-shop-s3  --ignore-existing;
      mc anonymous set public myminio/web-shop-s3 ;
      exit 0;
      "

  worker:
    command: watchfiles --filter python 'celery -A config.celery.app worker --loglevel=info'
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - POSTGRES_DB=web_telegram_shop.dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=2879
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_STORAGE_BUCKET_NAME=web-shop-s3
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_S3_SECURE_URLS=False
      - AWS_S3_REGION_NAME=us-east-1

  celery_beat:
    command: celery -A config.celery.app beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - POSTGRES_DB=web_telegram_shop.dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=2879
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_STORAGE_BUCKET_NAME=web-shop-s3
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_S3_SECURE_URLS=False
      - AWS_S3_REGION_NAME=us-east-1

  flower:
    build: ./backend
    container_name: flower_WEB_TELEGRAM_SHOP
    volumes:
      - ./backend:/app
    hostname: flower
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    command: celery -A config.celery.app flower --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS=redis
      - POSTGRES_HOST=pgbouncer
      - POSTGRES_PORT=5432
      - POSTGRES_DB=web_telegram_shop.dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=2879

  backend:
    command: sh -c "python manage.py makemigrations &&
      python manage.py migrate &&
      python manage.py setup_telegram_webhook &&
      python manage.py reload_shop_config &&
      python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((''127.0.0.1'', 8000))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 30s
    environment:
      - POSTGRES_DB=web_telegram_shop.dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=2879
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_STORAGE_BUCKET_NAME=web-shop-s3
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_S3_CUSTOM_DOMAIN=${NGROK_STATIC_DOMAIN}/web-shop-s3
      - AWS_S3_SECURE_URLS=True
      - AWS_S3_REGION_NAME=us-east-1
    volumes:
      - ./backend:/app

  frontend:
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=https://${NGROK_STATIC_DOMAIN}
      - CHOKIDAR_USEPOLLING=true
      - VITE_USE_POLLING=true
      - WATCHPACK_POLLING=true

  nginx:
    image: nginx:alpine
    container_name: nginx_WEB_TELEGRAM_SHOP
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf:ro
      - ./infra/nginx/html:/usr/share/nginx/custom_html:ro
    depends_on:
      - frontend
      - backend
      - minio
    ports:
      - "8080:80"

  ngrok:
    image: ngrok/ngrok:alpine
    container_name: ngrok_WEB_TELEGRAM_SHOP
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_STATIC_DOMAIN=${NGROK_STATIC_DOMAIN}
    depends_on:
      - nginx
    entrypoint: /bin/sh -c
    command: >
      "echo 'version: \"3\"' > /tmp/ngrok.yml &&
      echo 'agent:' >> /tmp/ngrok.yml &&
      echo '  web_addr: 0.0.0.0:4040' >> /tmp/ngrok.yml &&
      echo 'tunnels:' >> /tmp/ngrok.yml &&
      echo '  main_tunnel:' >> /tmp/ngrok.yml &&
      echo '    addr: nginx:80' >> /tmp/ngrok.yml &&
      echo '    proto: http' >> /tmp/ngrok.yml &&
      echo '    domain: '${NGROK_STATIC_DOMAIN} >> /tmp/ngrok.yml &&
      ngrok start --all --config /tmp/ngrok.yml"

volumes:
  db_data:
  minio_data:
